<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- 卡牌金色边框与反光渐变 -->
    <linearGradient id="goldCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#EAB308" />
      <stop offset="70%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 辉光渐变 -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="1" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>

    <!-- 紫色卡牌渐变 -->
    <linearGradient id="purpleCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- 投影滤镜 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 容器圆角基底 -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#goldCard)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- 底部叠放的第一张卡牌 (紫卡倾斜) -->
  <g transform="rotate(-15 32 34)">
    <rect x="18" y="12" width="28" height="38" rx="4" fill="url(#purpleCard)" opacity="0.8" stroke="#A5B4FC" stroke-width="1" />
    <circle cx="32" cy="28" r="6" fill="#C7D2FE" opacity="0.4" />
  </g>

  <!-- 上层主体卡牌 (金卡微倾) -->
  <g transform="rotate(8 32 34)">
    <rect x="18" y="11" width="28" height="38" rx="4" fill="#1E293B" stroke="url(#goldCard)" stroke-width="2" />
    <!-- 卡牌内框 -->
    <rect x="20.5" y="13.5" width="23" height="33" rx="2.5" fill="#0F172A" stroke="#FDE047" stroke-width="0.75" stroke-opacity="0.6" />
    <!-- 卡牌内侧金币/星芒基座 -->
    <circle cx="32" cy="28" r="9" fill="url(#starGlow)" opacity="0.4" />
  </g>

  <!-- 中心爆裂璀璨 SSR 八芒星 -->
  <g filter="url(#glow)">
    <!-- 辉光球 -->
    <circle cx="33" cy="29" r="6" fill="#FEF08A" opacity="0.9" />

    <!-- 主四角星芒 -->
    <path d="M33 16 C33 24 33 24 41 29 C33 34 33 34 33 42 C33 34 33 34 25 29 C33 24 33 24 33 16 Z" fill="#FFFBEB" />
    <path d="M33 19 C33 25 33 25 39 29 C33 33 33 33 33 39 C33 33 33 33 27 29 C33 25 33 25 33 19 Z" fill="#FDE047" />

    <!-- 次四角小星芒 -->
    <path d="M33 21 L35.5 26.5 L41 29 L35.5 31.5 L33 37 L30.5 31.5 L25 29 L30.5 26.5 Z" fill="#F59E0B" opacity="0.7" />

    <!-- 中心纯白亮斑 -->
    <circle cx="33" cy="29" r="2" fill="#FFFFFF" />
  </g>

  <!-- 闪亮小星点 -->
  <path d="M14 16 L15 19 L18 20 L15 21 L14 24 L13 21 L10 20 L13 19 Z" fill="#FDE047" opacity="0.9" />
  <path d="M50 42 L50.8 44.2 L53 45 L50.8 45.8 L50 48 L49.2 45.8 L47 45 L49.2 44.2 Z" fill="#38BDF8" opacity="0.9" />
</svg>